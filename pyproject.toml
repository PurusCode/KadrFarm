[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kadr-farm"
version = "0.2.0"
description = "Локальная фабрика технологических видео с семантическим монтажом"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = {text = "Proprietary - project files provided to the recipient"}
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.1",
  "requests>=2.32.0",
  "Pillow>=10.4.0",
  "soundfile>=0.12.1",
  "numpy>=1.26.0",
  "tzdata>=2025.2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
tts = [
  "num2words==0.5.14",
  "numpy==2.5.4",
  "onnxruntime==1.31.0",
  "soundfile==0.14.0",
  "huggingface_hub==2.3.0",
  "phonemizer-fork==3.3.2",
  "espeakng-loader==0.2.4",
  "transformers==5.20.2",
  "misaki @ git+https://github.com/hexgrad/misaki.git@fba1236595f2d2bf21d414ba6e57d25256afada3",
  "ruaccent @ git+https://github.com/Den4ikAI/ruaccent.git@39543da92705ab26103897eac7bc512c357449bd",
]
test = ["pytest>=8.0.0"]

[project.scripts]
kadr-farm = "kadr_farm.cli:main"
kadr-farm-semantic = "kadr_farm.semantic_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
